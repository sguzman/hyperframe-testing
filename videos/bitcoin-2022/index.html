    <style>
      :root {
        --color-up: #2ECC71;
        --color-down: #E74C3C;
        --color-text: #FFFFFF;
        --color-text-dark: #333333;
        --color-accent: #F1C40F;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        font-family: 'Space Grotesk', sans-serif; color: var(--color-text-dark);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      .weather-bg {
        position: absolute; inset: 0; z-index: -2;
      }
      .weather-sunny { background: #87CEEB; }
      .weather-rainy { background: #778899; }
      
      .year-display {
        position: absolute; top: 50px; left: 100px;
        font-family: 'Montserrat', sans-serif; font-size: 120px; font-weight: 900;
        opacity: 0.8;
      }
      
      .date-display {
        position: absolute; top: 180px; left: 110px;
        font-size: 60px; font-weight: 700;
      }
      
      .price-container {
        position: absolute; top: 50px; right: 100px;
        text-align: right;
      }
      
      .price-display {
        font-size: 100px; font-weight: 900;
      }
      
      .return-display {
        font-size: 60px; font-weight: 700;
      }
      
      #house-container {
        position: absolute; bottom: 0; left: 50%;
        width: 800px; height: 800px;
        z-index: 1;
        opacity: 0.5;
      }
      
      #soyjak-container {
        position: absolute; bottom: 100px; left: 50%;
        width: 350px; height: 350px;
        z-index: 2;
      }
      
      #soyjak-img {
        width: 100%; height: 100%;
        object-fit: contain;
      }
      
      #chart-container {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 600px;
        z-index: 0; opacity: 0.4;
      }
      
      .chart-line {
        fill: none; stroke: var(--color-accent); stroke-width: 12px;
        stroke-linecap: round; stroke-linejoin: round;
      }

      .grid-lines {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 100px 100px;
        z-index: -1;
      }
    </style>
