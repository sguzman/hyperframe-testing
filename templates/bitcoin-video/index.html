<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
    <style>
      :root {
        --color-up: #2ECC71;
        --color-down: #E74C3C;
        --color-text: #FFFFFF;
        --color-text-dark: #333333;
        --color-accent: #F1C40F;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        font-family: 'Space Grotesk', sans-serif; color: var(--color-text-dark);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      .weather-bg {
        position: absolute; inset: 0; z-index: -2;
      }
      .weather-sunny { background: #87CEEB; }
      .weather-rainy { background: #778899; }
      
      .year-display {
        position: absolute; top: 50px; left: 100px;
        font-family: 'Montserrat', sans-serif; font-size: 120px; font-weight: 900;
        opacity: 0.8;
      }
      
      .date-display {
        position: absolute; top: 180px; left: 110px;
        font-size: 60px; font-weight: 700;
      }
      
      .price-container {
        position: absolute; top: 50px; right: 100px;
        text-align: right;
      }
      
      .price-display {
        font-size: 100px; font-weight: 900;
      }
      
      .return-display {
        font-size: 60px; font-weight: 700;
      }
      
      #house-container {
        position: absolute; bottom: 0; left: 50%;
        width: 800px; height: 800px;
        z-index: 1;
        opacity: 0.5;
      }
      
      #soyjak-container {
        position: absolute; bottom: 100px; left: 50%;
        width: 350px; height: 350px;
        z-index: 2;
      }
      
      #soyjak-img {
        width: 100%; height: 100%;
        object-fit: contain;
      }
      
      #chart-container {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 600px;
        z-index: 0; opacity: 0.4;
      }
      
      .chart-line {
        fill: none; stroke: var(--color-accent); stroke-width: 12px;
        stroke-linecap: round; stroke-linejoin: round;
      }

      .grid-lines {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 100px 100px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="weather-bg weather-sunny" id="weather-bg"></div>
      
      <div id="sunny-elements" style="position: absolute; inset: 0; z-index: -1;">
        <!-- Sun -->
        <svg style="position: absolute; top: 100px; left: 200px; width: 250px; height: 250px;" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="#FFD700" />
        </svg>
        <!-- Clouds -->
        <svg style="position: absolute; top: 150px; left: 800px; width: 400px; height: 200px;" viewBox="0 0 100 50">
          <path d="M20 30 a 15 15 0 0 1 20 -15 a 15 15 0 0 1 30 0 a 15 15 0 0 1 -20 15 Z" fill="#FFFFFF" opacity="0.9" />
          <path d="M40 35 a 15 15 0 0 1 20 -15 a 15 15 0 0 1 30 0 a 15 15 0 0 1 -20 15 Z" fill="#FFFFFF" opacity="0.9" />
        </svg>
        <svg style="position: absolute; top: 250px; right: 200px; width: 300px; height: 150px;" viewBox="0 0 100 50">
          <path d="M20 30 a 15 15 0 0 1 20 -15 a 15 15 0 0 1 30 0 a 15 15 0 0 1 -20 15 Z" fill="#FFFFFF" opacity="0.8" />
        </svg>
      </div>

      <div id="rainy-elements" style="position: absolute; inset: 0; z-index: -1; opacity: 0;">
        <div style="position: absolute; inset: 0; background: repeating-linear-gradient(15deg, transparent, transparent 10px, rgba(255,255,255,0.15) 11px, rgba(255,255,255,0.15) 13px);"></div>
      </div>
      
      <!-- Grass Forefront -->
      <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: #228B22; z-index: 0;"></div>
      
      <div class="grid-lines"></div>
      <div id="chart-container">
        <svg id="chart-svg" width="1920" height="600" viewBox="0 0 1920 600"></svg>
      </div>
      
      <div id="house-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M10 90 L10 40 L50 10 L90 40 L90 90 Z" fill="#d2b48c" stroke="#333" stroke-width="2"/>
          <path d="M10 40 L50 10 L90 40" fill="#654321" stroke="#333" stroke-width="2"/>
          <rect x="40" y="60" width="20" height="30" fill="#8b4513" stroke="#333" stroke-width="2"/>
          <!-- Window -->
          <rect x="15" y="55" width="15" height="15" fill="#87CEEB" stroke="#333" stroke-width="2"/>
          <line x1="22.5" y1="55" x2="22.5" y2="70" stroke="#333" stroke-width="2"/>
          <line x1="15" y1="62.5" x2="30" y2="62.5" stroke="#333" stroke-width="2"/>
          <!-- Plant pot -->
          <polygon points="70,80 80,80 78,90 72,90" fill="#cd853f" stroke="#333" stroke-width="1"/>
          <path d="M75 80 Q70 70 75 65 Q80 70 75 80" fill="#228B22" stroke="#333" stroke-width="1"/>
        </svg>
      </div>
      
      <div id="soyjak-container">
        <img id="soyjak-happy" src="../../assets/memes/happy-soyjak.png" style="position: absolute; top: 0; left: 0;" />
        <img id="soyjak-sad" src="../../assets/memes/west-has-fallen.png" style="position: absolute; top: 0; left: 0; opacity: 0;" />
      </div>
      
      <div class="year-display" id="year-text">YEAR</div>
      <div class="date-display" id="date-text">YYYY-MM-DD</div>
      <div class="price-container">
        <div class="price-display" id="price-text">$0.00</div>
        <div class="return-display" id="return-text">0.00%</div>
      </div>

      <!-- AUDIO_TAGS_HERE -->
    </div>

    <script>
      // Data will be injected by the generator script
      const yearData = [];
      const year = "20XX";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      document.getElementById('year-text').innerText = typeof year !== 'undefined' ? year : '2011';
      
      // Initialize states
      gsap.set("#house-container", { xPercent: -50 });
      gsap.set("#soyjak-container", { xPercent: -50 });

      if (typeof yearData !== 'undefined' && yearData.length > 0) {
        const svg = d3.select("#chart-svg");
        const width = 1920;
        const height = 600;
        
        const x = d3.scaleLinear().domain([0, yearData.length - 1]).range([0, width]);
        const y = d3.scaleLinear()
          .domain([d3.min(yearData, d => d[1]) * 0.9, d3.max(yearData, d => d[1]) * 1.1])
          .range([height, 50]);
        
        const line = d3.line()
          .x((d, i) => x(i))
          .y(d => y(d[1]));

        const path = svg.append("path")
          .datum(yearData)
          .attr("class", "chart-line")
          .attr("d", line);

        const totalLength = path.node().getTotalLength();
        path.attr("stroke-dasharray", totalLength + " " + totalLength)
          .attr("stroke-dashoffset", totalLength);

        const timeOffset = 1;
        const availableDuration = yearData.length * 2;
        
        // Animation
        tl.to(path.node(), {
          attr: { "stroke-dashoffset": 0 },
          duration: availableDuration,
          ease: "none"
        }, timeOffset);

        // Price and Soyjak update
        yearData.forEach((d, i) => {
          const time = timeOffset + (i / yearData.length) * availableDuration;
          const date = d[0];
          const price = d[1];
          const prevPrice = i > 0 ? yearData[i-1][1] : price;
          const isUp = price >= prevPrice;
          const dailyReturn = prevPrice !== 0 ? ((price - prevPrice) / prevPrice) * 100 : 0;
          
          let digits = 2;
          if (price < 0.01) digits = 6;
          else if (price < 1) digits = 4;
          
          tl.set("#date-text", { innerText: date }, time);
          tl.set("#price-text", {
            innerText: "$" + price.toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits}),
          }, time);
          
          tl.set("#return-text", {
            innerText: (isUp ? "+" : "") + dailyReturn.toFixed(2) + "%",
            color: isUp ? "var(--color-up)" : "var(--color-down)"
          }, time);

          tl.set("#weather-bg", { className: isUp ? "weather-bg weather-sunny" : "weather-bg weather-rainy" }, time);
          tl.set("#sunny-elements", { opacity: isUp ? 1 : 0 }, time);
          tl.set("#rainy-elements", { opacity: isUp ? 0 : 1 }, time);

          tl.set("#soyjak-happy", { opacity: isUp ? 1 : 0 }, time);
          tl.set("#soyjak-sad", { opacity: isUp ? 0 : 1 }, time);
        });
      }

      // Character bounce
      const cycleDuration = 0.6;
      const computedTotalDuration = (typeof yearData !== 'undefined' && yearData.length > 0) ? (1 + yearData.length * 2 + 2) : 15;
      tl.to("#soyjak-container", {
        y: -30,
        repeat: Math.floor(computedTotalDuration / cycleDuration) - 1,
        yoyo: true,
        duration: cycleDuration,
        ease: "sine.inOut"
      }, 0);

      window.__timelines["main"] = tl;
    </script>

  </body>
</html>
